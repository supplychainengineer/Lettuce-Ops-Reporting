<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LettuceOps RCM Reporter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: app chrome (theme-aware) around a fixed-size letter document. The report pages are always white paper, 816x1056, so screen, print and PDF match. */
:root{
  --bg:#eef1ed; --surface:#ffffff; --sunken:#e3e8e2; --line:#d5dcd3;
  --fg:#16201a; --fg2:#4d5a51; --fg3:#75827a;
  --brand:#2e7d32; --brand-soft:#e6f1e6; --on-brand:#ffffff;
  --good:#1d7a3a; --good-bg:#e2f3e6; --warn:#8a5a00; --warn-bg:#fbefd0; --bad:#b3261e; --bad-bg:#fbe4e2; --info:#3b5568; --info-bg:#e6edf2;
  --font:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121613; --surface:#1a1f1b; --sunken:#232a24; --line:#343d36; --fg:#edf1ed; --fg2:#bcc6be; --fg3:#8d998f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1a1f1b; --sunken:#232a24; --line:#343d36; --fg:#edf1ed; --fg2:#bcc6be; --fg3:#8d998f; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:21px;font-weight:700} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:600}
p{margin:0} .muted{color:var(--fg2)} .small{font-size:13px}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:10px}
nav a{padding:7px 14px;border-radius:7px;color:var(--fg2);text-decoration:none;font-weight:600;font-size:14px}
nav a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:22px}
.block{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,.btn{font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--fg3)}
button.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:#16201a}
input.txt,textarea,.fgrid input{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
textarea{width:100%;min-height:80px;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:13px;font-weight:600}
.fld input{font-variant-numeric:tabular-nums;width:100%}
.fld .h{font:400 11.5px var(--mono);color:var(--fg3)}
.prog{height:6px;background:var(--sunken);border-radius:9px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--brand)}
.sol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.sol:first-of-type{border-top:0}
.sol .w{grid-column:1/-1}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:13px;font-weight:400;padding:3px 9px;border:1px solid var(--line);border-radius:99px;cursor:pointer}
.fld .chk input,.chk input{accent-color:var(--brand);width:auto;margin:0}
@media (max-width:600px){.sol{grid-template-columns:minmax(0,1fr)}}
#tip{position:fixed;z-index:20;pointer-events:none;background:#16201a;color:#fff;font-size:12.5px;line-height:1.4;padding:6px 9px;border-radius:6px;max-width:240px;white-space:pre-line;font-variant-numeric:tabular-nums}

/* ----- the document ----- */
.docwrap{overflow-x:auto}
#doc{width:816px;display:flex;flex-direction:column;gap:18px;transform-origin:top left}
.page{--ink:#16201a;--ink2:#4d5a51;--ink3:#75827a;--rule:#dfe5dd;--tint:#f4f6f3;
  width:816px;min-height:1056px;background:#ffffff;color:var(--ink);padding:40px 52px 34px;display:flex;flex-direction:column;gap:13px;
  box-shadow:0 1px 3px rgba(0,0,0,.14);font-size:12.5px;line-height:1.5;position:relative}
.page h2{font-size:22px;letter-spacing:-.01em} .page h3{font-size:13.5px;font-weight:700}
.page .eyebrow{color:var(--ink3);font-size:9.5px}
.page .muted{color:var(--ink2)} .page .small{font-size:11px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--brand)}
.phead .b{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.phead .b img{height:30px;max-width:180px;object-fit:contain}
.phead .b span{color:var(--brand)}
.phead .r{text-align:right;font:400 9.5px/1.45 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.pfoot{margin-top:auto;padding-top:9px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;font:400 9px/1.4 var(--mono);color:var(--ink3);letter-spacing:.04em}
.ptitle{display:flex;flex-direction:column;gap:3px}
.lead{font-size:14px;line-height:1.45;color:var(--ink2);max-width:640px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))} .cols.c4{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cols.w{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.card{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.t{background:var(--tint);border-color:var(--tint)}
.tile{border-top:2px solid var(--ink);padding-top:7px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .l{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.tile .v{font-size:23px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .d{font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.up{color:#1d7a3a;font-weight:700} .dn{color:#b3261e;font-weight:700}
.idx{display:flex;gap:18px;align-items:center}
.page .idx svg{width:124px;height:124px;flex:none}
.meter{display:grid;grid-template-columns:150px 50px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:11.5px;padding:3px 0}
.meter .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.meter .t{font:400 9.5px var(--mono);color:var(--ink3);text-align:right}
.track{height:8px;background:#e9ede8;border-radius:2px;position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.find{display:grid;grid-template-columns:76px minmax(0,1fr) 118px;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--rule)}
.find:first-child{border-top:0;padding-top:0}
.find h4{font-size:12.5px;font-weight:700}
.find .imp{text-align:right}
.find .imp b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.find .imp span{font:400 9px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;font:500 9px var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.pill.good{color:#1d7a3a;background:#e2f3e6} .pill.warn{color:#8a5a00;background:#fbefd0} .pill.bad{color:#b3261e;background:#fbe4e2} .pill.info{color:#3b5568;background:#e6edf2}
.via{font-size:11px;color:var(--ink2)} .via a,.page a{color:var(--brand);font-weight:700;text-decoration:none}
.page svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.legend i.ln{height:3px;width:14px;vertical-align:3px}
.page table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:11.5px}
.page th,.page td{padding:4.5px 8px;border-bottom:1px solid var(--rule);text-align:right}
.page th:first-child,.page td:first-child{text-align:left}
.page thead th{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);border-bottom:1px solid var(--ink)}
.page tr.sec td{font-weight:700;background:var(--tint)}
.page tr.sub td:first-child{padding-left:20px;color:var(--ink2)}
.page tr.tot td{font-weight:700}
.page table.tight td{padding-block:3px}
.rv input{width:96px}
.chans{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--sunken);border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:2px}
.chip input.txt{width:130px;border:0;background:transparent;padding:4px 6px}
.chip button{border:0;padding:4px 7px;background:transparent;color:var(--fg2)}
.rv tr.sec td{font-weight:700;padding-top:12px;color:var(--brand)}
.rv td,.rv th{text-align:left}
.rv input.claude,.key.claude{background:var(--warn-bg)}
.rv input.conflict,.key.conflict{background:var(--bad-bg);border-color:var(--bad)}
.key{padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.say{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px;color:var(--ink2)}
.say b{color:var(--ink)}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:11.5px;padding:1.5px 0}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hb .track{height:12px;background:transparent} .hb .track i{border-radius:0 3px 3px 0}
.funnel{display:flex;flex-direction:column;gap:5px}
.fn{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:center}
.fn .bar{height:30px;border-radius:0 4px 4px 0;display:flex;align-items:center;padding-left:9px;color:#fff;font-weight:700;font-size:14px;min-width:38px}
.fn .l{font-weight:600} .fn .l small{display:block;font:400 9.5px var(--mono);color:var(--ink3)}
.leak{margin-left:128px;font-size:10.5px;color:var(--ink2)}
.notes{border:1px dashed var(--rule);border-radius:6px;padding:9px 12px;min-height:44px;white-space:pre-wrap;color:var(--ink)}
.notes:empty::before{content:"Analyst notes for this page. Add anything the numbers do not capture. Left empty, this box is not printed.";color:var(--ink3)}
.noteh{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:-10px}
.solcard{border:1px solid var(--rule);border-left:3px solid var(--brand);border-radius:4px;padding:11px 14px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center}
.solcard .cta{text-align:right}
.cta a{display:inline-block;background:var(--brand);color:#fff;padding:6px 11px;border-radius:4px;font-size:11.5px}
.solcard .hk{font-weight:700;color:var(--brand)}
.exporting .solcard.nl{grid-template-columns:minmax(0,1fr)}
@media print{.solcard.nl{grid-template-columns:minmax(0,1fr)}}
.spot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border:1px solid var(--brand);border-radius:6px;overflow:hidden}
.spot .sl{background:var(--tint);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.spot .sl .big{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.spot .sl h4{font-size:13.5px;margin-top:6px}
.spot .sr{background:var(--brand);color:#ffffff;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.spot .sr .eyebrow{color:#ffffff}
.spot .sr .hook{font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.spot .sr .cta{margin-top:auto;text-align:left}
.spot .sr .cta a{background:#ffffff;color:var(--brand)}
.spot .sr .nolink{color:#ffffff}
.nolink{color:var(--ink2)}
.page.cover{padding:0;gap:0}
.cv-top{padding:46px 56px 0;display:flex;justify-content:space-between;align-items:center}
.cv-top img{height:46px;max-width:260px;object-fit:contain}
.cv-top .cv-name{font-size:24px;font-weight:700;color:var(--brand)}
.cv-top .r{text-align:right;font:400 10px/1.5 var(--mono);color:var(--ink3);letter-spacing:.06em}
.cv-mid{padding:150px 56px 0;display:flex;flex-direction:column;gap:8px}
.cv-mid .eyebrow{font-size:11px;color:var(--brand)}
.cv-mid h1{font-size:58px;line-height:1.02;letter-spacing:-.025em;font-weight:700}
.cv-month{font-size:25px;color:var(--ink2)}
.cv-nums{padding:64px 56px 0;display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:26px;align-items:center}
.page .cv-ring svg{width:118px;height:118px}
.cv-nums .tile .v{font-size:27px}
.cv-band{margin-top:auto;background:var(--brand);color:#ffffff;padding:34px 56px 38px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px}
.cv-band .eyebrow{color:#ffffff}
.cv-band ol{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;font-size:13.5px}
.cv-band li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.28)}
.cv-by{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.cv-by b{font-size:19px;margin-top:6px}
.cv-by .cv-conf{margin-top:auto;font:400 9.5px/1.5 var(--mono);letter-spacing:.04em}
.levers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--tint);border-radius:6px;padding:10px 12px}
.lever label{display:flex;justify-content:space-between;font-weight:600;font-size:11px}
.lever output{font-variant-numeric:tabular-nums;color:var(--brand)}
.lever input{width:100%;accent-color:var(--brand);margin:2px 0 0}
.hit{fill:transparent} .hit:hover{fill:rgba(42,120,214,.1)}
.exporting .page{box-shadow:none} .exporting .screen,.exporting .notes.e,.exporting .noteh.e{display:none!important} .exporting .notes{border-style:solid}
@media print{
  @page{size:8.5in 11in;margin:0}
  body{background:#fff;padding:0} .wrap{max-width:none;gap:0} header.top,.noprint,#view-data,#view-settings,.screen,.notes.e,.noteh.e{display:none!important}
  #view-report{display:block!important} #doc{gap:0;zoom:1!important;transform:none!important} .docwrap{overflow:visible;height:auto!important}
  .page{box-shadow:none;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact} .notes{border-style:solid}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="who">
      <label class="eyebrow" for="selP">Practice</label>
      <select id="selP"></select>
      <button id="newP" type="button">New practice</button>
    </div>
    <nav aria-label="Views">
      <a href="#data" data-v="data">1 · Enter numbers</a>
      <a href="#report" data-v="report">2 · Report</a>
      <a href="#settings" data-v="settings">Branding &amp; products</a>
    </nav>
  </header>
  <section class="view" id="view-data" hidden></section>
  <section class="view" id="view-report"></section>
  <section class="view" id="view-settings" hidden></section>
</div>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ================= definitions ================= */
const BASE_FIELDS = [
  {sec:"Lettuce Verify", src:"PMS reporting and the LettuceOps tracker sheet"},
  ["exams","Exams scheduled","n"],["keptRate","Kept exam rate %","%"],
  ["insSingle","Patients with single coverage","n"],["insDual","Patients with dual coverage","n"],
  ["verPrior","Prior verifications","n"],["verSame","Same-day verifications","n"],["verPost","Post-exam verifications","n"],
  {sec:"Lettuce Claim", src:"Treatment contract sheet and the tracking sheet"},
  ["starts","Treatment starts","n"],["startsPrior","…of which from exams in earlier months (optional)","n","opt"],["convRate","Starts conversion rate %","%"],
  ["aobSub","AOB to subscriber $","$"],["aobPrac","AOB to practice $","$"],
  ["submitted","Claims submitted","n"],["pending","Claims pending","n"],["denialRate","Denial rate %","%"],["resubRate","Re-submit rate %","%"],
  {sec:"Production", src:"Practice reports sheet"},
  ["startsIns","Starts with insurance","n"],["sds","SDS (same-day starts)","n"],["gross","Gross production $","$"],["adj","Production adjustment $","$"],
  ["payInFull","Pay-in-full cases","n"],["avgDeposit","Initial deposit (mode) $","$"],
  {sec:"Insurance A/R", src:"PMS aging report"},
  ["insFR","Future revenue $","$"],["insCur","Overdue: current cycle $","$"],["ins30","Overdue: 1–30 $","$"],["ins60","Overdue: 31–60 $","$"],["ins90","Overdue: 61–90 $","$"],["ins91","Overdue: 91+ $","$"],
  {sec:"Patient A/R", src:"PMS aging report"},
  ["patFR","Future revenue $","$"],["patCur","Overdue: current cycle $","$"],["pat30","Overdue: 1–30 $","$"],["pat60","Overdue: 31–60 $","$"],["pat90","Overdue: 61–90 $","$"],["pat91","Overdue: 91+ $","$"]
];
/* Payment methods differ by practice, so each practice keeps its own list. Values live on the month under
   the channel id (amount) and id+"N" (count). The first ids match the original fixed fields, so old data still reads. */
const LEGACY_CH={ins:[{id:"insCheck",name:"Check"},{id:"insVC",name:"Virtual card"}],pat:[{id:"patFinix",name:"Finix"},{id:"patElite",name:"Elite"},{id:"patCheck",name:"Check"},{id:"patCash",name:"Cash"}]};
const NEW_CH={ins:[{id:"insCheck",name:"Check"},{id:"insVC",name:"Virtual card"},{id:"insEFT",name:"EFT / direct deposit"}],pat:[{id:"patCard",name:"Card"},{id:"patCheck",name:"Check"},{id:"patCash",name:"Cash"}]};
const SIDES=[["ins","Insurance"],["pat","Patient"]];
const chans = pr => (pr&&pr.channels)||LEGACY_CH;
function fieldsFor(pr){ const c=chans(pr), pay=[{sec:"Payment posting", src:"Payment posting sheet", pay:true}];
  SIDES.forEach(([side,S])=>c[side].forEach(ch=>pay.push([ch.id,`${S}: ${ch.name} $`,"$"],[ch.id+"N",`${S}: ${ch.name} count`,"n"])));
  return BASE_FIELDS.concat(pay); }
const F = () => fieldsFor(P());
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const BUCKETS = [["Cur","Current cycle"],["30","1–30"],["60","31–60"],["90","61–90"],["91","91+"]];
const TRIGGERS = {volume:"Exam volume drops",kept:"No-shows / kept rate below target",conv:"Conversion below target",verify:"Insurance verified late",claims:"Denied or pending claims",aob:"Benefit paid to the subscriber",insAR:"Overdue insurance A/R",patAR:"Aged patient A/R",always:"Always show"};

  const x=m=>L+(W-L-R)*m/N, y=v=>T+(H-T-B)*(1-v/ymax), path=k=>pts.map((p,i)=>(i?"L":"M")+x(p.m).toFixed(1)+" "+y(p[k]).toFixed(1)).join("");
  const area=path("scn")+pts.slice().reverse().map(p=>"L"+x(p.m).toFixed(1)+" "+y(p.base).toFixed(1)).join("")+"Z"; let g="";
  ticks.forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${C.rule}"/>`+tx(L-6,y(t)+3.5,usdK(t),{a:"end",s:9.5}); });
  for(let m=0;m<=N;m+=3) g+=tx(x(m),H-6,m?"Mo "+m:"Now",{a:"middle",s:9.5});
  let ys=y(pr.scn), yb=y(pr.base); if(Math.abs(ys-yb)<26){ const mid=(ys+yb)/2, up=pr.scn>=pr.base?-1:1; ys=mid+up*13; yb=mid-up*13; }
  const lab=(yy,n,v)=>tx(W-R+7,yy-2,n,{s:9})+tx(W-R+7,yy+10,usdK(v),{s:11.5,w:700,f:C.ink}), cw=(W-L-R)/N;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative net production, current pace against scenario">${g}<path d="${area}" fill="${C.gap}"/>
    <path d="${path("base")}" fill="none" stroke="${C.s1}" stroke-width="2"/><path d="${path("scn")}" fill="none" stroke="${C.s2}" stroke-width="2"/>
    <circle cx="${x(N)}" cy="${y(pr.base)}" r="3.5" fill="${C.s1}" stroke="#fff" stroke-width="1.5"/><circle cx="${x(N)}" cy="${y(pr.scn)}" r="3.5" fill="${C.s2}" stroke="#fff" stroke-width="1.5"/>
    ${lab(yb,"Current pace",pr.base)}${lab(ys,pr.label||"Scenario",pr.scn)}

}

/* ---------- PDF: each page is rendered to an image at 2x and placed on a letter sheet; links stay clickable ---------- */
async function makePdf(){
  const dc=$("#doc"), z=dc.style.zoom; dc.style.zoom=1; dc.classList.add("exporting");
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:"pt",format:"letter",compress:true}), PW=612, PH=792; let first=true;
    /* chart labels are redrawn as page text so they use the same font as everything else */
    const relabel=(doc,cel)=>{ const pr=cel.getBoundingClientRect(); cel.querySelectorAll("svg").forEach(sv=>{ const vb=sv.viewBox&&sv.viewBox.baseVal, w=sv.getBoundingClientRect().width, k=vb&&vb.width?w/vb.width:1;
      sv.querySelectorAll("text").forEach(t=>{ const r=t.getBoundingClientRect(), fs=parseFloat(t.getAttribute("font-size")||10)*k, sp=doc.createElement("span"); sp.textContent=t.textContent;
        sp.style.cssText=`position:absolute;left:${r.left-pr.left}px;top:${r.top-pr.top+(r.height-fs*1.2)/2}px;font-size:${fs}px;line-height:1.2;font-weight:${t.getAttribute("font-weight")||400};color:${t.getAttribute("fill")||"#16201a"};white-space:nowrap;font-variant-numeric:tabular-nums;font-family:"DM Sans",Arial,sans-serif;${t.getAttribute("stroke")?"text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff":""}`;
        cel.appendChild(sp); t.remove(); }); }); };
    for(const el of dc.querySelectorAll(".page")){
      const cv=await html2canvas(el,{scale:3,backgroundColor:"#ffffff",logging:false,useCORS:true,onclone:relabel}), k=PW/cv.width, hPt=cv.height*k, n=Math.max(1,Math.ceil((hPt-14)/PH));
      const img=cv.toDataURL("image/jpeg",0.9), pr=el.getBoundingClientRect(), s=PW/pr.width, base=first?1:pdf.getNumberOfPages()+1;
      for(let i=0;i<n;i++){ if(!first) pdf.addPage(); first=false; pdf.addImage(img,"JPEG",0,-i*PH,PW,hPt,undefined,"FAST"); }
      el.querySelectorAll("a[href^='http']").forEach(a=>{ const r=a.getBoundingClientRect(), y=(r.top-pr.top)*s, pi=Math.min(n-1,Math.floor(y/PH)); pdf.setPage(base+pi); pdf.link((r.left-pr.left)*s,y-pi*PH,r.width*s,r.height*s,{url:a.href}); });
      /* invisible text over the image, word by word, so the PDF can be searched and copied */
      const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), rg=document.createRange(); let nd;
      while((nd=tw.nextNode())){ const re=/\S+/g; let mt; while((mt=re.exec(nd.data))){ const word=mt[0].replace(/[^\x20-\x7E]/g,""); if(!word) continue; rg.setStart(nd,mt.index); rg.setEnd(nd,mt.index+mt[0].length);
        const r=rg.getBoundingClientRect(); if(!r.width||!r.height) continue; const fs=r.height/1.3*s, y=(r.bottom-pr.top)*s-fs*0.32, pi=Math.min(n-1,Math.max(0,Math.floor(y/PH)));
        try{ pdf.setPage(base+pi); pdf.setFontSize(Math.max(2,fs)); pdf.text(word,(r.left-pr.left)*s,y-pi*PH,{renderingMode:"invisible"}); }catch(e){} } }
    }
    return pdf.output("blob");
  } finally { dc.classList.remove("exporting"); dc.style.zoom=z; }
}

  const name=`${(pr.short||pr.name).replace(/[^\w-]+/g,"")}_${m.label}${m.year||""}_${DB.brand.tagline.replace(/[^\w]+/g,"")}_Report.pdf`;

}

/* ================= read past reports (PDF) =================
   Two readers: a text reader for tables stored as text, and Claude reading the page images for
   tables stored as pictures. Nothing is saved until the user checks the numbers and chooses Save. */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfReady=null, UP=null;
const loadScript=src=>new Promise((ok,no)=>{ const el=document.createElement("script"); el.src=src; el.onload=ok; el.onerror=()=>no(new Error("load")); document.head.appendChild(el); });
function loadPdfJs(){ if(window.pdfjsLib&&window.pdfjsWorker) return Promise.resolve(); return pdfReady||(pdfReady=loadScript(PDFJS+"pdf.min.js").then(()=>loadScript(PDFJS+"pdf.worker.min.js")).catch(e=>{ pdfReady=null; throw e; })); }
const rowsOf=items=>{ const rows=[]; [...items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(it=>{ const r=rows.find(r=>Math.abs(r.y-it.y)<3); r?r.items.push(it):rows.push({y:it.y,items:[it]}); }); rows.forEach(r=>r.items.sort((a,b)=>a.x-b.x)); return rows; };
async function readPdf(file, maxImg){
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, pages=[], images=[]; let text="";
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i), tc=await pg.getTextContent();
    const items=tc.items.filter(t=>t.str.trim()).map(t=>({s:t.str,x:t.transform[4],y:t.transform[5],w:t.width||0}));
    pages.push(items); text+=`\n--- page ${i} ---\n`+rowsOf(items).map(r=>r.items.map(t=>t.s).join(" ")).join("\n");
    if(i<=maxImg){ const vp=pg.getViewport({scale:1.6}), cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      const cx=cv.getContext("2d"); cx.fillStyle="#ffffff"; cx.fillRect(0,0,cv.width,cv.height); await pg.render({canvasContext:cx,viewport:vp}).promise;
      images.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85))); } }
  return {pages,images,text,numPages:doc.numPages};
}
const MIDX=s=>{ const t=String(s).trim().toLowerCase(); if(t.length<3) return -1; return MONTHS.findIndex(M=>M.toLowerCase()===t||M.slice(0,3).toLowerCase()===t); };
const VALRE=/^(?:\$?\s?-?[\d,]*\.?\d+%?|\$?[\d,]+(?:\.\d+)?\s?\(\d+\)|[-–—])$/;
const numOf=s=>{ const t=String(s).trim(); if(/^[-–—]$/.test(t)) return 0; const v=parseFloat(t.replace(/[$,%\s]/g,"")); return Number.isFinite(v)?v:null; };
const CH_ALIAS={vc:"virtualcard",virtualcards:"virtualcard",cheque:"check",checks:"check",eft:"eftdirectdeposit",ach:"eftdirectdeposit",directdeposit:"eftdirectdeposit",creditcard:"card",cards:"card"};
const chNorm=n=>{ const k=norm(n); return CH_ALIAS[k]||k; };
function payKey(side, name){ const c=chans(P())[side].find(c=>chNorm(c.name)===chNorm(name)); return c?c.id:`new:${side}:${String(name).replace(/[|:]/g," ").trim().slice(0,40)}`; }
function fieldFor(label, sec){
  const L=norm(label), S=norm(sec), ins=/insurance/.test(S), pat=/patient/.test(S);
  if(/^starts.*ins/.test(L)) return "startsPair";
  const R=[[/^examsscheduled|^examscheduled/,"exams"],[/keptexamrate/,"keptRate"],[/^single/,"insSingle"],[/^dual/,"insDual"],[/priorverification/,"verPrior"],[/^sameday/,"verSame"],[/^postexam/,"verPost"],
    [/^(tx|treatment)starts$/,"starts"],[/conv/,"convRate"],[/aobsubscriber/,"aobSub"],[/aobpractice/,"aobPrac"],[/^submitted$/,"submitted"],[/^pending$/,"pending"],[/denialrate/,"denialRate"],[/resubmit/,"resubRate"],
    [/^sds$/,"sds"],[/grossproduction/,"gross"],[/productionadjustment/,"adj"],[/payinfull/,"payInFull"],[/initialdeposit/,"avgDeposit"]];
  for(const [re,k] of R) if(re.test(L)) return k;
  if(ins||pat){ const p=ins?"ins":"pat";
    if(/futurerevenue|totalfr/.test(L)) return p+"FR"; if(/currentcycle/.test(L)) return p+"Cur";
    if(/aging13[01]$/.test(L)) return p+"30"; if(/aging3160$/.test(L)) return p+"60"; if(/aging6190$/.test(L)) return p+"90"; if(/aging91/.test(L)) return p+"91";
  }
  return null;
}
/* Text reader: finds tables whose header row names months (or the payment-posting header) and reads each row. */
function parseReport(pages, text){
  const tm=text.match(new RegExp("("+MONTHS.join("|")+")\\s+(?:20\\d\\d\\s+)?(?:Monthly\\s+)?Report","i")), dm=text.match(/\b\d{1,2}\/\d{1,2}\/(20\d\d)\b/);
  const yrs=(text.match(/\b20\d\d\b/g)||[]).map(Number), yr=dm?+dm[1]:yrs.length?Math.max(...yrs):null;
  let repIdx=tm?MIDX(tm[1]):-1, out={}, count=0, latestHdr=-1;
  const tables=[];
  pages.forEach(items=>{ const rows=rowsOf(items);
    rows.forEach(r=>{ const mc=r.items.filter(t=>t.x>150&&MIDX(t.s)>=0);
      if(mc.length) tables.push({items,y:r.y,cols:mc.map(t=>({c:t.x+t.w/2,m:MIDX(t.s)}))});
      else if(/payments\s*posted/i.test(r.items.map(t=>t.s).join(" "))) tables.push({items,y:r.y,pay:true,cols:r.items.filter(t=>t.x>150).map((t,j)=>({c:t.x+t.w/2,role:j?"N":""}))}); }); });
  tables.forEach(t=>{ if(!t.pay) t.cols.forEach(c=>latestHdr=Math.max(latestHdr,c.m)); });
  if(repIdx<0) repIdx=latestHdr;
  const yearOf=mi=>yr===null?null:(repIdx>=0&&mi>repIdx?yr-1:yr);
  const put=(mi,k,v)=>{ if(v===null||mi<0) return; const key=MONTHS[mi]+"|"+yearOf(mi); (out[key]=out[key]||{})[k]=v; count++; };
  tables.forEach((t,ti)=>{
    const ends=t.items.filter(it=>it.y<t.y-2&&/^(References|Note:|Pending Claims)/i.test(it.s.trim())).map(it=>it.y), nextHdr=tables.filter(o=>o.items===t.items&&o.y<t.y-2).map(o=>o.y);
    const stop=Math.max(t.y-620,...ends,...nextHdr), reg=t.items.filter(it=>it.y<t.y-2&&it.y>stop);
    const vals=reg.filter(it=>it.x>180&&VALRE.test(it.s.trim())), labs=reg.filter(it=>it.x<180&&!VALRE.test(it.s.trim()));
    const groups=[]; vals.sort((a,b)=>b.y-a.y).forEach(v=>{ const g=groups.find(g=>Math.abs(g.y-v.y)<4); g?g.items.push(v):groups.push({y:v.y,items:[v]}); });
    const used=new Set();
    groups.forEach(g=>{ const ls=labs.filter(l=>Math.abs(l.y-g.y)<=12); ls.forEach(l=>used.add(l)); g.label=rowsOf(ls).map(r=>r.items.map(i=>i.s).join("")).join(" "); });
    const secs=rowsOf(labs.filter(l=>!used.has(l))).map(r=>({y:r.y,s:r.items.map(i=>i.s).join("")}));
    groups.forEach(g=>{ const sec=(secs.filter(x=>x.y>g.y).sort((a,b)=>a.y-b.y)[0]||{}).s||"";
      if(t.pay){ const side=/insurance/i.test(sec)?"ins":/patient/i.test(sec)?"pat":null; if(!side||!g.label.trim()) return; const pk=payKey(side,g.label);
        g.items.forEach(v=>{ const col=t.cols.reduce((a,c)=>Math.abs(c.c-(v.x+v.w/2))<Math.abs(a.c-(v.x+v.w/2))?c:a); put(repIdx,col.role?(pk.startsWith("new:")?pk+":N":pk+"N"):pk,numOf(v.s)); }); return; }
      const k=fieldFor(g.label,sec); if(!k) return;
      g.items.forEach(v=>{ const col=t.cols.reduce((a,c)=>Math.abs(c.c-(v.x+v.w/2))<Math.abs(a.c-(v.x+v.w/2))?c:a);

        if(k==="startsPair"){ const m2=v.s.match(/([\d,]+)\s*\((\d+)\)/); if(m2){ put(col.m,"starts",+m2[1].replace(/,/g,"")); put(col.m,"startsIns",+m2[2]); } return; }
        put(col.m,k,numOf(v.s)); }); });
  });
  count=Object.values(out).reduce((a,o)=>a+Object.keys(o).length,0);
  return {repIdx, year:yr, months:out, count};
}
async function askClaude(sample, rd, name, maxImg){
  const keys=F().filter(Array.isArray).filter(f=>!f[3]).map(f=>`${f[0]}: ${f[1].replace(/ [$%]$/,"")}`).join("\n");
  const prompt=`The attached images are the pages, in order, of a monthly revenue-cycle report for an orthodontic practice (file "${name}"). The text that could be extracted from the PDF is below; some tables exist only in the images.

Extract every monthly figure the report prints, for every month it covers. Tables often show three months side by side; include all of them. Use only these field keys:
${keys}

Rules:
- Numbers only: no $, %, commas or units (81.3% -> 81.3, $22,102.50 -> 22102.5).
- A dash in a count column means 0.
- "#Starts(#Ins) 35(14)" means starts 35 and startsIns 14.
- Insurance A/R and Patient A/R have separate keys (ins... and pat...). Payment counts use the keys ending in N.
- A payment method that has no key above: use new:ins:<method name> for insurance or new:pat:<method name> for patient amounts, and the same key followed by :N for its count.
- Leave out any field the report does not print. Never estimate or calculate a figure, and do not use figures from the written summary when a table shows them.
- Work out the year from dates in the report.

Reply with only JSON in this shape:
{"reportMonth":"October","reportYear":2026,"months":[{"month":"October","year":2026,"values":{"exams":51,"keptRate":90.1}}]}

Extracted text:
${rd.text.slice(0,60000)}`;
  const r=await sample.json(prompt,{images:rd.images.slice(0,maxImg)});
  const ok=new Set(F().filter(Array.isArray).map(f=>f[0])), out={}; let count=0;
  (r&&Array.isArray(r.months)?r.months:[]).forEach(mm=>{ const mi=MIDX(mm&&mm.month), y=parseInt(mm&&mm.year); if(mi<0||!y) return;
    Object.entries(mm.values||{}).forEach(([k,v])=>{ const n=typeof v==="number"?v:numOf(v); const nm=String(k).match(/^new:(ins|pat):([^|]{1,40}?)(:N)?$/);
      if(nm){ const pk=payKey(nm[1],nm[2]); k=pk.startsWith("new:")?pk+(nm[3]||""):pk+(nm[3]?"N":""); }
      if((!ok.has(k)&&!/^new:/.test(k))||n===null||!Number.isFinite(n)) return; ((out[MONTHS[mi]+"|"+y]=out[MONTHS[mi]+"|"+y]||{}))[k]=n; count++; }); });
  return {months:out,count,repIdx:MIDX(r&&r.reportMonth),year:parseInt(r&&r.reportYear)||null};
}
async function handleUpload(files){
  const msg=$("#upMsg"), say=t=>{ if(msg) msg.textContent=t; };
  try{ say("Loading the PDF reader…"); await loadPdfJs(); }catch(e){ say("The PDF reader could not load. Check the internet connection and try again."); return; }
  let sample=null, lim=null; try{ sample=window.claude&&window.claude.use?await window.claude.use("sample"):null; lim=sample?await sample.limits().catch(()=>null):null; }catch(e){ sample=null; }
  const maxImg=lim&&lim.images?Math.min(12,lim.images.maxCount||8):(sample?0:0), results=[];
  for(const [i,f] of files.entries()){
    say(`Reading ${f.name} (${i+1} of ${files.length})…`);
    try{
      const rd=await readPdf(f, maxImg), det=parseReport(rd.pages, rd.text); let ai=null, aiNote="";
      if(sample&&maxImg){ say(`Claude is reading the tables in ${f.name}… this can take up to a minute.`);
        try{ ai=await askClaude(sample, rd, f.name, maxImg); }catch(e){ aiNote=e&&e.code==="not_granted"?"Claude was not allowed, so tables stored as images were not read.":e&&e.code==="rate_limited"?"Claude is busy; try this file again in a minute.":"Claude could not read this file."; } }
      else aiNote=sample?"This view cannot send page images to Claude, so tables stored as images were not read.":"Claude is only available when the tool is opened inside Claude, so tables stored as images were not read.";
      if(det.year===null&&ai&&ai.year){ det.year=ai.year; }
      results.push({name:f.name,det,ai,aiNote,pages:rd.numPages});
    }catch(e){ results.push({name:f.name,error:"This file could not be read as a PDF."}); }
  }
  UP=buildReview(results); say(""); renderData(); const box=$("#upBox"); if(box) box.scrollIntoView({block:"start"});
}
function buildReview(results){
  const cells={}, months=new Map(), files=[];
  const order=r=>{ const d=r.det||{}, a=r.ai||{}; const y=d.year||a.year||0, m=d.repIdx>=0?d.repIdx:(a.repIdx>=0?a.repIdx:0); return y*12+m; };
  results.filter(r=>!r.error).sort((a,b)=>order(a)-order(b)).forEach(r=>{
    const d=r.det.months, a=r.ai?r.ai.months:{};
    /* text-read keys may lack a year when the report had none; fill from Claude's year or skip */
    const fix=k=>{ const [m,y]=k.split("|"); return y==="null"?(r.ai&&r.ai.year?m+"|"+(MONTHS.indexOf(m)>(r.ai.repIdx>=0?r.ai.repIdx:11)?r.ai.year-1:r.ai.year):null):k; };
    const keys=new Set([...Object.keys(d).map(fix),...Object.keys(a)].filter(Boolean));
    keys.forEach(k=>{ const [m,y]=k.split("|"); months.set(k,{label:m,year:+y});
      const dk=Object.keys(d).find(x=>fix(x)===k), dv=dk?d[dk]:{}, av=a[k]||{};
      new Set([...Object.keys(dv),...Object.keys(av)]).forEach(f=>{ const t=dv[f], c=av[f];
        cells[k+"|"+f]= t!==undefined ? {v:t,src:c!==undefined&&Math.abs(t-c)>0.005?"conflict":"text",alt:c} : {v:c,src:"claude"}; }); });
    files.push({name:r.name,line:`${r.det.repIdx>=0?MONTHS[r.det.repIdx]+" "+(r.det.year||r.ai&&r.ai.year||""):"Report"} · ${r.det.count} values read from text${r.ai?`, ${r.ai.count} read by Claude`:""}`,note:r.aiNote});
  });
  results.filter(r=>r.error).forEach(r=>files.push({name:r.name,line:r.error,bad:true}));
  const ms=[...months.values()].sort((a,b)=>mKey(a)-mKey(b)).slice(-12);
  return {months:ms,cells,files};
}

  <div class="block"><div class="row" style="justify-content:space-between"><h2>Month</h2><div class="row"><button id="addE" type="button">Add earlier month</button><button class="primary" id="addM" type="button">Add next month</button><button id="delM" type="button">Remove ${esc(ms[ms.length-1].label)}</button></div></div>
    <div class="row">${ms.map((x,i)=>`<button type="button" data-mi="${i}" aria-pressed="${i===mi}">${esc(x.label)} ${x.year||""}</button>`).join("")}</div>
    <div class="row"><span class="small muted" id="pgTxt">${done} of ${nf()} fields entered for ${esc(m.label)}</span><div class="prog"><i id="pgBar" style="width:${done/nf()*100}%"></i></div><a class="btn" href="#report" style="text-decoration:none">See the report →</a></div>
    <p class="small muted">Enter what you have. Sections with no numbers are left out of the report. The grey line under each box is last month's value. The report is built for the newest month that has numbers and compares it with the month before.</p></div>
  <div class="panel block" id="upBox"><div><h3>Upload past reports</h3><span class="small muted">Upload the monthly report PDFs already sent to this practice, up to 12 months. The tool reads the numbers out of them and shows them here to check before anything is saved.</span></div>
    <div class="row"><input type="file" id="upFile" accept="application/pdf,.pdf" multiple aria-label="Report PDFs"><span class="small muted" id="upMsg"></span></div>
    ${reviewHTML()}</div>
  <details class="panel block" id="impBox"><summary><b>Or paste past months from a spreadsheet</b> <span class="small muted">· for figures that are not in a report PDF</span></summary>
    <ol class="small muted" style="margin:6px 0;padding-left:18px;display:flex;flex-direction:column;gap:3px">
      <li>Choose <b>Copy template</b>. It has one row per field and one column per month for the last 12 months, with any numbers already entered.</li>
      <li>Paste it into Excel or Google Sheets and fill in the past months from earlier reports. Leave blanks where you don't have a number.</li>
      <li>Select the whole table, including the month row and the field column, copy it, paste it below and choose <b>Import</b>.</li></ol>
    <div class="row"><button id="tplCopy" type="button">Copy template</button><span class="small muted" id="impMsg"></span></div>
    <textarea id="impTxt" spellcheck="false" placeholder="Paste the filled-in table here"></textarea>
    <div class="row"><button class="primary" id="impGo" type="button">Import</button><span class="small muted">Imported numbers replace what is already in those months. Months are put in date order automatically.</span></div></details>
  ${secs}
  <div class="panel block"><h3>Pending claims: action required</h3><span class="small muted">One line per claim. This appears in the report, so use an identifier you are allowed to share.</span><textarea id="pendTxt">${esc(m.pendingText||"")}</textarea></div>`;
}
const dv=$("#view-data");
dv.addEventListener("change", e=>{ if(e.target.id==="upFile"&&e.target.files.length) handleUpload([...e.target.files]); if(e.target.dataset.ch){ const y=window.scrollY; renderData(); window.scrollTo(0,y); } });
dv.addEventListener("input", e=>{
  const t=e.target, pr=P(), m=pr.months[mi];
  if(t.dataset.ch){ if(!pr.channels) pr.channels=clone(chans(pr)); pr.channels[t.dataset.ch][+t.dataset.ci].name=t.value; save(); return; }
  if(t.dataset.up){ const c=UP&&UP.cells[t.dataset.up]; const v=parseNum(t.value); if(c){ c.v=v; } else if(UP&&v!==null){ UP.cells[t.dataset.up]={v,src:"text"}; } return; }
  if(t.dataset.f){ m[t.dataset.f]=parseNum(t.value); pr.scn=null; const dn=fieldCount(m); $("#pgTxt").textContent=`${dn} of ${nf()} fields entered for ${m.label}`; $("#pgBar").style.width=dn/nf()*100+"%"; }
  else if(t.id==="pName"){ pr.name=t.value; fillPractices(); }
  else if(t.id==="pShort") pr.short=t.value;
  else if(t.id==="pSource") pr.source=t.value;
  else if(t.id==="pGroup"){ pr.group=t.value; fillPractices(); }
  else if(t.id==="pendTxt") m.pendingText=t.value;
  else return;
  save();
});
dv.addEventListener("click", e=>{
  const t=e.target, pr=P(), ms=pr.months;
  if(t.dataset.mi!==undefined){ mi=+t.dataset.mi; renderData(); }
  if(t.dataset.chadd){ const side=t.dataset.chadd; if(!pr.channels) pr.channels=clone(chans(pr)); pr.channels[side].push({id:side+"X"+Math.random().toString(36).slice(2,8),name:"New method"}); save(); renderData(); const inp=$(`#ch-${side}-${pr.channels[side].length-1}`); if(inp){ inp.focus(); inp.select(); } }
  if(t.dataset.chrm){ const side=t.dataset.chrm, i=+t.dataset.ci, ch=chans(pr)[side][i], used=pr.months.some(x=>has(x[ch.id]));
    if(used&&!t.dataset.arm){ t.dataset.arm=1; t.textContent="Remove?"; t.title="Click again to remove. Numbers already entered for it are no longer shown or counted."; return; }
    if(!pr.channels) pr.channels=clone(chans(pr)); pr.channels[side].splice(i,1); save(); renderData(); }
  if(t.id==="upSave") saveUpload();
  if(t.id==="upDrop"){ UP=null; renderData(); }
  if(t.id==="addE"){ const f=ms[0], i=MONTHS.indexOf(f.label); ms.unshift({label:MONTHS[(i+11)%12], year:(f.year||new Date().getFullYear())-(i===0?1:0)}); pr.scn=null; mi=0; save(); renderData(); }
  if(t.id==="tplCopy"){ const tsv=templateTSV(pr), ta=$("#impTxt"), msg=$("#impMsg"); const fb=()=>{ ta.value=tsv; ta.select(); msg.textContent="Template is in the box below and selected. Press Ctrl/Cmd+C to copy."; };
    try{ navigator.clipboard.writeText(tsv).then(()=>msg.textContent="Template copied. Paste it into a spreadsheet.",fb); }catch(err){ fb(); } }
  if(t.id==="impGo"){ const r=importTable($("#impTxt").value,pr); if(r.ok){ mi=null; save(); renderData(); const box=$("#impBox"); box.open=true; $("#impMsg").textContent=r.msg; } else $("#impMsg").textContent=r.msg; }
  if(t.id==="addM"){ const l=ms[ms.length-1], i=MONTHS.indexOf(l.label); ms.push({label:MONTHS[(i+1)%12], year:(l.year||new Date().getFullYear())+(i===11?1:0)}); pr.scn=null; mi=ms.length-1; save(); renderData(); }
  if(t.id==="delM"&&ms.length>1){ if(t.dataset.arm){ ms.pop(); pr.scn=null; mi=null; save(); renderData(); } else { t.dataset.arm=1; t.textContent="Click again to remove"; } }
});

/* ================= settings ================= */
function applyBrand(){
  const c=/^#[0-9a-f]{6}$/i.test(DB.brand.color)?DB.brand.color:"#2e7d32", n=parseInt(c.slice(1),16), mix=v=>Math.round(v+(255-v)*0.88);
  const r=document.documentElement.style; r.setProperty("--brand",c); r.setProperty("--brand-soft",`rgb(${mix(n>>16)},${mix(n>>8&255)},${mix(n&255)})`);
}
function renderSettings(){
  const el=$("#view-settings"), B=DB.brand, pr=P();
  el.innerHTML=`
  <div class="panel block"><h2>Branding</h2><p class="small muted">Shown on every page of every report.</p><div class="fgrid">
    <div class="fld"><label for="bName">Company name</label><input id="bName" class="txt" data-b="name" value="${esc(B.name)}"></div>
    <div class="fld"><label for="bTag">Report line</label><input id="bTag" class="txt" data-b="tagline" value="${esc(B.tagline)}"></div>
    <div class="fld"><label for="bColor">Brand colour</label><input id="bColor" type="color" data-b="color" value="${esc(B.color)}" style="height:34px;padding:2px"></div>
    <div class="fld"><label for="bContact">Contact line</label><input id="bContact" class="txt" data-b="contact" value="${esc(B.contact)}" placeholder="name@company.com"></div>
    <div class="fld" style="grid-column:1/-1"><label for="bFoot">Page footer</label><input id="bFoot" class="txt" data-b="footer" value="${esc(B.footer)}"></div>
    <div class="fld"><label for="bLogo">Logo (PNG or SVG, under 400 KB)</label><input id="bLogo" type="file" accept="image/*"><span class="h" id="logoMsg">${B.logo?"Logo loaded.":"No logo. The company name is shown as text."}</span></div>
    ${B.logo?`<div class="fld"><label>&nbsp;</label><button id="rmLogo" type="button">Remove logo</button></div>`:""}</div></div>
  <div class="panel block"><h2>Product catalog</h2><p class="small muted">Say what each product does and tick the problems it solves. When a practice's report shows one of those problems, the tool puts that product beside the finding. The product matched to the most serious finding becomes the spotlight on the last page, with its best feature as the headline. Entries stay out of the PDF until “Ready to show clients” is ticked, so placeholders are safe to leave.</p>
    ${DB.products.map((s,i)=>`<div class="sol"><div class="fld"><label for="sn-${i}">Product name</label><input id="sn-${i}" class="txt" data-s="${i}" data-sk="name" value="${esc(s.name)}"></div>
      <div class="fld"><label for="su-${i}">Link (becomes a button in the PDF)</label><input id="su-${i}" class="txt" data-s="${i}" data-sk="url" value="${esc(s.url)}" placeholder="https://"></div>
      <div class="fld w"><label for="sh-${i}">Best feature, in one sentence (the spotlight headline)</label><input id="sh-${i}" class="txt" data-s="${i}" data-sk="hook" value="${esc(s.hook)}"></div>
      <div class="fld w"><label for="sp-${i}">What it does</label><textarea id="sp-${i}" data-s="${i}" data-sk="what" style="min-height:54px">${esc(s.what)}</textarea></div>
      <div class="fld w"><label>Problems it solves</label><div class="row">${Object.entries(TRIGGERS).filter(([k])=>k!=="always").map(([k,v])=>`<label class="chk"><input type="checkbox" id="sc-${i}-${k}" data-s="${i}" data-solve="${k}"${(s.solves||[]).includes(k)?" checked":""}> ${v}</label>`).join("")}</div></div>
      <div class="row w" style="justify-content:space-between"><div class="row"><label class="chk"><input type="checkbox" id="sr-${i}" data-s="${i}" data-flag="ready"${s.ready?" checked":""}> <b>Ready to show clients</b></label><label class="chk"><input type="checkbox" id="sa-${i}" data-s="${i}" data-flag="always"${s.always?" checked":""}> Always list on the last page</label></div><button type="button" data-rm="${i}">Remove</button></div></div>`).join("")}
    <div><button class="primary" id="addS" type="button">Add a product</button></div></div>
  <div class="panel block"><h2>Targets for ${esc(pr.name)}</h2><p class="small muted">The Revenue Health Index and the findings measure the practice against these. They are starting values, not industry benchmarks; set them per practice.</p><div class="fgrid">
    ${Object.entries(TARGETS).map(([k,v])=>`<div class="fld"><label for="tg-${k}">${v[0]} ${v[3]>v[2]?"(at most)":"(at least)"} %</label><input id="tg-${k}" data-t="${k}" inputmode="decimal" value="${n0(pr.targets[k])}"></div>`).join("")}</div>
    <h3 style="margin-top:8px">Assumed loss rate on overdue A/R, by age (%)</h3><div class="fgrid">${BUCKETS.map(k=>`<div class="fld"><label for="rk-${k[0]}">${k[1]}</label><input id="rk-${k[0]}" data-r="${k[0]}" inputmode="decimal" value="${n0(pr.risk[k[0]])}"></div>`).join("")}</div></div>
  <div class="panel block"><h2>Backup and move</h2><p class="small muted">Everything is saved in this browser only. Copy this text to back it up or move it to another computer; paste it here and choose Load to restore.</p>
    <textarea id="fJson" spellcheck="false"></textarea>
    <div class="row"><button id="jCopy" type="button">Copy</button><button id="jLoad" type="button">Load pasted data</button><button id="delP" type="button">Delete practice “${esc(pr.name)}”</button><button id="rst" type="button">Reset everything to the sample</button><span class="small muted" id="jMsg"></span></div></div>`;
  $("#fJson").value=JSON.stringify(DB);
}
const sv=$("#view-settings");
sv.addEventListener("input", e=>{
  const t=e.target, ds=t.dataset;
  if(ds.b){ DB.brand[ds.b]=t.value; if(ds.b==="color") applyBrand(); }
  else if(ds.s!==undefined){ const q=DB.products[+ds.s]; if(ds.solve){ q.solves=(q.solves||[]).filter(k=>k!==ds.solve); if(t.checked) q.solves.push(ds.solve); } else if(ds.flag) q[ds.flag]=t.checked; else q[ds.sk]=t.value; }
  else if(ds.t) P().targets[ds.t]=parseNum(t.value)??0;
  else if(ds.r) P().risk[ds.r]=parseNum(t.value)??0;
  else return;
  save();
});
sv.addEventListener("change", e=>{
  if(e.target.id==="bLogo"){ const f=e.target.files[0]; if(!f) return; if(f.size>400*1024){ $("#logoMsg").textContent="That file is over 400 KB. Use a smaller image."; return; }
    const fr=new FileReader(); fr.onload=()=>{ DB.brand.logo=fr.result; save(); renderSettings(); }; fr.readAsDataURL(f); }
});
sv.addEventListener("click", e=>{
  const t=e.target, id=t.id, arm=()=>{ if(t.dataset.arm) return true; t.dataset.arm=1; t.textContent="Click again to confirm"; return false; };
  if(id==="rmLogo"){ DB.brand.logo=""; save(); renderSettings(); }
  if(id==="addS"){ DB.products.push({name:"",hook:"",what:"",url:"",solves:[],ready:false,always:false}); save(); renderSettings(); }
  if(t.dataset.rm!==undefined){ DB.products.splice(+t.dataset.rm,1); save(); renderSettings(); }
  if(id==="jCopy"){ const ta=$("#fJson"); ta.value=JSON.stringify(DB); const fb=()=>{ ta.select(); $("#jMsg").textContent="Selected. Press Ctrl/Cmd+C to copy."; }; try{ navigator.clipboard.writeText(ta.value).then(()=>$("#jMsg").textContent="Copied.",fb); }catch(err){ fb(); } }
  if(id==="jLoad"){ try{ const o=JSON.parse($("#fJson").value); if(!o||!Array.isArray(o.practices)||!o.practices.length) throw 0; DB=Object.assign(clone(SAMPLE),o); boot(); $("#jMsg").textContent="Loaded."; }catch(err){ $("#jMsg").textContent="That text is not a valid backup. Paste the full text copied from this box."; } }
  if(id==="delP"&&arm()){ if(DB.practices.length>1){ DB.practices=DB.practices.filter(p=>p.id!==DB.cur); DB.cur=DB.practices[0].id; boot(); } else $("#jMsg").textContent="This is the only practice. Add another before deleting it."; }
  if(id==="rst"&&arm()){ DB=clone(SAMPLE); boot(); }
});

/* ================= chrome ================= */
function fillPractices(){ $("#selP").innerHTML=DB.practices.map(p=>`<option value="${p.id}"${p.id===DB.cur?" selected":""}>${esc(p.name||"Unnamed practice")}${p.group?" · "+esc(p.group):""}</option>`).join(""); }
$("#selP").addEventListener("change", e=>{ DB.cur=e.target.value; mi=null; save(); route(); });
$("#newP").addEventListener("click", ()=>{ const now=new Date(), id="p"+Date.now();
  DB.practices.push({id,name:"New practice",short:"NEW",source:"",group:P().group||"",channels:clone(NEW_CH),targets:clone(SAMPLE_PRACTICE.targets),risk:clone(SAMPLE_PRACTICE.risk),scn:null,months:[{label:MONTHS[now.getMonth()],year:now.getFullYear()}]});
  DB.cur=id; mi=null; save(); fillPractices(); location.hash="#data"; route(); });
const tip=$("#tip");
document.addEventListener("pointermove", e=>{ const t=e.target.closest&&e.target.closest("[data-tip]"); if(!t){ tip.hidden=true; return; }
  tip.textContent=t.getAttribute("data-tip"); tip.hidden=false; const r=tip.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(window.innerWidth-r.width-8,e.clientX+14))+"px"; tip.style.top=Math.max(8,e.clientY-r.height-12)+"px"; });
const VIEWS={data:renderData,report:renderReport,settings:renderSettings};
function route(){
  const v=VIEWS[location.hash.slice(1)]?location.hash.slice(1):"report";
  document.querySelectorAll("nav a").forEach(a=>a.dataset.v===v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  Object.keys(VIEWS).forEach(k=>$("#view-"+k).hidden=k!==v);
  VIEWS[v]();
}
function boot(){ if(!DB.practices.find(p=>p.id===DB.cur)) DB.cur=DB.practices[0].id; DB.practices.forEach(p=>{ sortMonths(p); if(!p.channels) p.channels=clone(LEGACY_CH); }); mi=null; save(); applyBrand(); fillPractices(); route(); }
window.addEventListener("hashchange",route);
boot();
</script>
</body>
</html>
